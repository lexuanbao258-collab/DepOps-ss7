services:
  quickbite-user:
    image: quickbite-user-service:latest
    container_name: quickbite-user
    ports: ["8081:8081"]
    environment:
      SERVER_PORT: 8081
      DB_HOST: quickbite-db
      DB_PORT: 5432
      DB_NAME: quickbite_user_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
    networks: [quickbite-net]

  quickbite-restaurant:
    image: quickbite-restaurant-service:latest
    container_name: quickbite-restaurant
    ports: ["8082:8082"]
    environment:
      SERVER_PORT: 8082
      DB_HOST: quickbite-db
      DB_PORT: 5432
      DB_NAME: quickbite_restaurant_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
    networks: [quickbite-net]

  quickbite-order:
    image: quickbite-order-service:latest
    container_name: quickbite-order
    ports: ["8083:8083"]
    environment:
      SERVER_PORT: 8083
      DB_HOST: quickbite-db
      DB_PORT: 5432
      DB_NAME: quickbite_order_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
    networks: [quickbite-net]

  quickbite-notification:
    image: quickbite-notification-service:latest
    container_name: quickbite-notification
    ports: ["8084:8084"]
    environment:
      SERVER_PORT: 8084
      DB_HOST: quickbite-db
      DB_PORT: 5432
      DB_NAME: quickbite_notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DDL_AUTO: update
    networks: [quickbite-net]

networks:
  quickbite-net:
    external: true
    name: quickbite-net
