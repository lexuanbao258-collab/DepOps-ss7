name: User Service CI

on:
  push:
    branches:
      - main

jobs:
  build_job:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: quickbite-project/user-service

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar

      - name: Upload user-service artifact
        uses: actions/upload-artifact@v4
        with:
          name: user-service-artifact
          path: quickbite-project/user-service/build/libs/*.jar
          retention-days: 3
